
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>简洁导航</title>
<link rel="shortcut icon" href="favicon.ico">
<meta name="Keywords" content=""/>
<meta name="Description" content="巨海纳百川，麟阁多才贤，致力为实现开放包容的互联网努力！"/>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <script>
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var iframeSrc = isMobile? 'http://m.bidianer.com/iiii' : 'https://www.bidianer.com/iiii';
    var iframe = document.createElement('iframe');
    iframe.src = iframeSrc;
    iframe.onload = function() {
      var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      var elementsToRemove = [
        '.el-alert.el-alert--warning.is-light',
        '.wx-login-alert.panel',
        '.guest-function-guide.card-opacity.box',
        '.panel.card-opacity.fixed-slider-button.el-tooltip.item.focusing',
        '.panel.card-opacity.fixed-slider-button.el-dropdown-selfdefine.focusing',
        '.el-button.el-tooltip.go-home-btn.el-button--default.el-button--mini.focusing',
        '.flex.items-center.login',
        '.action.flex.single',
        '.web-header',
        '.category-operation.horizontal',
        '.right-icon.text-lighter.el-icon-more'
      ];
      elementsToRemove.forEach(function(selector) {
        var elements = iframeDoc.querySelectorAll(selector);
        for (var i = 0; i < elements.length; i++) {
          elements[i].style.display = 'none';
        }
      });
    };
    document.body.appendChild(iframe);
  </script>
</body>

</html>
